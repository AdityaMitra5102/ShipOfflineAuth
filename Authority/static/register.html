<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port Authority &mdash; Ship Credential</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 9'%3E%3Crect width='9' height='9' fill='%230b1b3a'/%3E%3Cg fill='%23fff'%3E%3Cpath d='M1 1h3v3H1z M5 1h3v3H5z M1 5h3v3H1z'/%3E%3C/g%3E%3Cg fill='%230b1b3a'%3E%3Cpath d='M2 2h1v1H2z M6 2h1v1H6z M2 6h1v1H2z'/%3E%3C/g%3E%3Crect x='5' y='5' width='1' height='1' fill='%23fff'/%3E%3Crect x='7' y='7' width='1' height='1' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    
  <script type="module">
    import {
        create,
        parseCreationOptionsFromJSON,
    } from '/webauthn-json.browser-ponyfill.js';

    async function start() {
      const shipInput = document.getElementById('ship').value.trim();
      
      let request = await fetch('/api/register/begin', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ship: shipInput}),
      });
      let json = await request.json();
            
      let options = parseCreationOptionsFromJSON(json);
    
      let response = await create(options);
      let completeRequest = await fetch('/api/register/complete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(response),
      });
      
      let completeJson = await completeRequest.json();
      document.getElementById('result').textContent = JSON.stringify(completeJson, null, 2);
    }

    window.start = start;
  </script>

</head>
<body>

    <header class="app-header no-print">
        <h1>Country Authority</h1>
        <p class="subtitle">Ship credential issuing</p>
    </header>

    <main>
        <!-- ---------------------------------------------------------------
             Input: one field, one button.
             The button calls windows.start(), which is YOURS to define -
             see the script at the bottom of this file. Whatever it puts
             into #result becomes the QR code.
        ---------------------------------------------------------------- -->
        <button type="button" id="db" onclick="window.location.href='db.html'">History</button>
        <section class="card no-print">
            <label for="ship">Ship ID</label>
            <input id="ship" type="text" autocomplete="off" spellcheck="false"
                   placeholder="e.g. IMO9074729">

            <button type="button" id="issue" onclick="windows.start()">
                Issue credential
            </button>

            <p id="error" class="error" hidden></p>
        </section>

        <!-- ---------------------------------------------------------------
             Output: the printable credential. Everything inside #printable
             is what the printer puts on paper. It appears as soon as
             #result has content.
        ---------------------------------------------------------------- -->
        <section id="printable" class="card credential" hidden>
            <h2 class="credential-title">Ship Clearance Credential</h2>

            <div id="qr-container" class="qr-container"></div>

            <div id="result" class="token"
                 spellcheck="false" role="textbox" aria-multiline="false"
                 aria-label="License VC"></div>

            <button type="button" id="qr-print" class="no-print">
                Print credential
            </button>
        </section>
    </main>

    <!-- Vendored from github.com/hamzaharoon1314/QR-Code-Scan (MIT, Kazuhiko Arase) -->
    <script src="js/qrcode.js"></script>
    <script src="js/qrcode_UTF8.js"></script>
    <script src="js/app.js"></script>

 </body>
</html>
