<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FleetWatch | Ship Activity Database</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-soft: #f0f9ff;
      --primary-border: #bae6fd;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --row-hover: #f8fafc;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.02);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #f0f7ff 0%, #f8fafc 260px);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 20px;
    }

    .wrapper {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Purpose-built Clean Header */
    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 26px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-md);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.25);
    }

    .brand-text h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .brand-text p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 450;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      position: relative;
    }

    .pulse-dot::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: #10b981;
      border-radius: 50%;
      animation: pulse-ring 2s infinite ease-out;
    }

    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(3); opacity: 0; }
    }

    /* Controls: Search & Counter */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 0 4px;
    }

    .stat-badge {
      font-size: 14px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-badge strong {
      color: var(--text-main);
      font-size: 15px;
      font-weight: 700;
    }

    .search-input {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 16px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      width: 250px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.16);
    }

    .search-input::placeholder {
      color: var(--text-light);
    }

    /* Table Design */
    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    thead tr {
      background: #f8fafc;
      border-bottom: 1px solid var(--card-border);
    }

    th {
      padding: 15px 22px;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s ease;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: var(--row-hover);
    }

    td {
      padding: 16px 22px;
      font-size: 14px;
    }

    .col-idx {
      width: 60px;
      color: var(--text-light);
      font-size: 13px;
      font-weight: 600;
    }

    .ship-cell {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 650;
      color: var(--text-main);
    }

    .ship-badge {
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .time-cell {
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 10px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Clean, Purpose-Designed Header -->
    <div class="header-card">
      <div class="brand-section">
        <div class="brand-icon">
          <!-- Sleek Radar/Fleet Icon -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" opacity="0.3"/>
            <circle cx="12" cy="12" r="5" opacity="0.6"/>
            <circle cx="12" cy="12" r="2" fill="currentColor"/>
            <path d="M12 3a9 9 0 0 1 9 9"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>FleetWatch</h1>
          <p>Real-time Ship Activity & Timestamp Registry</p>
        </div>
      </div>
      <div class="header-right">
        <div class="live-indicator">
          <span class="pulse-dot"></span>
          <span id="sync-label">Active</span>
        </div>
      </div>
    </div>

    <!-- Controls / Quick Search -->
    <div class="controls">
      <div class="stat-badge">
        <span>Total Ships: <strong id="total-count">0</strong></span>
        <span>•</span>
        <span id="last-sync" style="font-size: 13px;">Checking records...</span>
      </div>
      <input type="text" id="search-box" class="search-input" placeholder="🔍 Search ships..." />
    </div>

    <!-- Table -->
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th class="col-idx">#</th>
            <th>Ship Name</th>
            <th style="width: 230px;">Recorded Timestamp</th>
          </tr>
        </thead>
        <tbody id="ship-rows">
          <tr>
            <td colspan="3" class="empty-state">
              <div class="empty-icon">⏳</div>
              <div>Connecting to database...</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let allRecords = [];

    // Fetch records dynamically from Flask endpoint or CSV
    async function loadData() {
      try {
        let fetched = [];

        // 1. Try Flask API endpoint first
        try {
          const res = await fetch('/api/ships');
          if (res.ok) {
            const data = await res.json();
            fetched = data.map(item => ({ ship: item[0], timestamp: item[1] }));
          }
        } catch (e) {
          // Fallback to direct CSV file if Flask route is not active
        }

        // 2. If API was not reachable, fetch ships.csv directly
        if (fetched.length === 0) {
          const res = await fetch('ships.csv?t=' + Date.now());
          if (res.ok) {
            const text = await res.text();
            const lines = text.trim().split('\n').filter(l => l.trim().length > 0);
            const dataLines = lines[0].toLowerCase().startsWith('ship,') ? lines.slice(1) : lines;
            fetched = dataLines.map(line => {
              const commaIdx = line.indexOf(',');
              return {
                ship: commaIdx !== -1 ? line.substring(0, commaIdx).trim() : line.trim(),
                timestamp: commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : ''
              };
            });
          }
        }

        allRecords = fetched;
        render();
        document.getElementById('last-sync').textContent = `Updated: ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        console.error("Failed to load records:", err);
      }
    }

    // Render table rows based on search input
    function render() {
      const tbody = document.getElementById('ship-rows');
      const query = document.getElementById('search-box').value.toLowerCase().trim();
      const filtered = allRecords.filter(r => r.ship.toLowerCase().includes(query));

      document.getElementById('total-count').textContent = allRecords.length;

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="3" class="empty-state">
              <div class="empty-icon">🌊</div>
              <div>${allRecords.length === 0 ? 'No ships in database yet.' : 'No matching ships found.'}</div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map((item, idx) => `
        <tr>
          <td class="col-idx">${idx + 1}</td>
          <td>
            <span class="ship-cell">
              ${item.ship}
              <span class="ship-badge">SHIP</span>
            </span>
          </td>
          <td class="time-cell">🕒 ${item.timestamp}</td>
        </tr>
      `).join('');
    }

    // Live search listener
    document.getElementById('search-box').addEventListener('input', render);

    // Initial load immediately
    loadData();

    // Check for updates every 2 seconds
    setInterval(loadData, 2000);
  </script>
</body>
</html>
